<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%" style="background: #0D0A0A; font-family: 'Inter', 'Segoe UI', sans-serif;">
  <defs>
    <!-- Xentro Red-Gold gradient -->
    <linearGradient id="xentroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63329" />
      <stop offset="100%" stop-color="#F5A623" />
    </linearGradient>
    <linearGradient id="darkShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A1A1A" />
      <stop offset="100%" stop-color="#0D0A0A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark (Left Group) -->
  <g transform="translate(30, 25)">
    <path d="M 75,15 L 125,40 V 100 C 125,130 75,155 75,155 C 75,155 25,130 25,100 V 40 Z" 
          fill="url(#darkShield)" stroke="#2A1A1A" stroke-width="3" />
    <rect x="42" y="55" width="60" height="40" rx="6" 
          fill="#2A1A1A" stroke="#E63329" stroke-width="1.5" stroke-opacity="0.5" 
          transform="rotate(-12 72 75)" />
    <rect x="48" y="55" width="60" height="40" rx="6" 
          fill="url(#xentroGrad)" filter="url(#glow)" opacity="0.9"
          transform="rotate(8 78 75)" />
    <path d="M 63,65 L 87,85 M 87,65 L 63,85" 
          stroke="#0D0A0A" stroke-width="4.5" stroke-linecap="round" 
          transform="rotate(8 78 75)" />
  </g>

  <!-- Wordmark (Right Group) -->
  <g transform="translate(180, 112)">
    <text x="0" y="0" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="1">XEN<tspan fill="#E63329">CARD</tspan></text>
  </g>
</svg>
