<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%" style="background: #0B0F17; font-family: 'Inter', 'Segoe UI', sans-serif;">
  <defs>
    <!-- Card & Glow Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="darkShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark (Left Group) -->
  <g transform="translate(30, 25)">
    <!-- Outer Shield / Vault Base -->
    <path d="M 75,15 L 125,40 V 100 C 125,130 75,155 75,155 C 75,155 25,130 25,100 V 40 Z" 
          fill="url(#darkShield)" stroke="#1E293B" stroke-width="3" />

    <!-- Back Layer Card -->
    <rect x="42" y="55" width="60" height="40" rx="6" 
          fill="#1E293B" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.5" 
          transform="rotate(-12 72 75)" />

    <!-- Front Glow Card (Intersecting X Pattern) -->
    <rect x="48" y="55" width="60" height="40" rx="6" 
          fill="url(#cyanBlue)" filter="url(#glow)" opacity="0.9"
          transform="rotate(8 78 75)" />

    <!-- Minimalist 'X' Cutout Accent -->
    <path d="M 63,65 L 87,85 M 87,65 L 63,85" 
          stroke="#0B0F17" stroke-width="4.5" stroke-linecap="round" 
          transform="rotate(8 78 75)" />
  </g>

  <!-- Wordmark (Right Group) -->
  <g transform="translate(180, 112)">
    <text x="0" y="0" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="1">XEN<tspan fill="#00F2FE">CARD</tspan></text>
    <text x="2" y="28" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="7">K E E P E R</text>
  </g>
</svg>
