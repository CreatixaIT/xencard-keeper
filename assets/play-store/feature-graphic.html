<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1024px;
            height: 500px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        .container {
            width: 1024px;
            height: 500px;
            background: linear-gradient(135deg, #0B0F17 0%, #0D1B2A 40%, #0F2027 70%, #0B0F17 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Glowing orbs */
        .orb1 {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,212,170,0.15) 0%, transparent 70%);
            top: -80px;
            right: 100px;
        }
        .orb2 {
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,150,255,0.1) 0%, transparent 70%);
            bottom: -60px;
            left: 80px;
        }
        .orb3 {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,212,170,0.08) 0%, transparent 70%);
            top: 180px;
            left: 350px;
        }

        /* Glass cards floating */
        .glass-card {
            position: absolute;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
        }
        .card1 {
            width: 180px;
            height: 110px;
            top: 60px;
            left: 60px;
            transform: rotate(-8deg);
            border-color: rgba(0,212,170,0.2);
        }
        .card1-line {
            position: absolute;
            height: 6px;
            border-radius: 3px;
            background: rgba(0,212,170,0.3);
        }
        .card1 .l1 { width: 80px; top: 25px; left: 20px; }
        .card1 .l2 { width: 120px; top: 42px; left: 20px; background: rgba(255,255,255,0.1); height: 4px; }
        .card1 .l3 { width: 90px; top: 55px; left: 20px; background: rgba(255,255,255,0.07); height: 4px; }
        .card1 .l4 { width: 60px; top: 68px; left: 20px; background: rgba(255,255,255,0.05); height: 4px; }

        .card2 {
            width: 160px;
            height: 100px;
            bottom: 70px;
            right: 70px;
            transform: rotate(6deg);
            border-color: rgba(0,150,255,0.15);
        }
        .card2-line {
            position: absolute;
            height: 5px;
            border-radius: 3px;
            background: rgba(0,150,255,0.25);
        }
        .card2 .l1 { width: 70px; top: 22px; left: 18px; }
        .card2 .l2 { width: 110px; top: 38px; left: 18px; background: rgba(255,255,255,0.08); height: 3px; }
        .card2 .l3 { width: 80px; top: 50px; left: 18px; background: rgba(255,255,255,0.06); height: 3px; }

        .card3 {
            width: 140px;
            height: 85px;
            top: 40px;
            right: 180px;
            transform: rotate(12deg);
            border-color: rgba(255,255,255,0.08);
            opacity: 0.5;
        }

        /* Content */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
        }
        .app-icon {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: linear-gradient(135deg, #00D4AA 0%, #00B894 100%);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0,212,170,0.3);
        }
        .app-icon span {
            font-size: 36px;
            color: #0B0F17;
            font-weight: 800;
        }
        .title {
            font-size: 48px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }
        .title .accent {
            color: #00D4AA;
        }
        .tagline {
            font-size: 20px;
            color: rgba(255,255,255,0.5);
            font-weight: 400;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        /* Scan line effect */
        .scan-line {
            position: absolute;
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00D4AA, transparent);
            top: 200px;
            left: 70px;
            transform: rotate(-8deg);
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="orb1"></div>
        <div class="orb2"></div>
        <div class="orb3"></div>

        <div class="glass-card card1">
            <div class="card1-line l1"></div>
            <div class="card1-line l2"></div>
            <div class="card1-line l3"></div>
            <div class="card1-line l4"></div>
        </div>

        <div class="glass-card card2">
            <div class="card2-line l1"></div>
            <div class="card2-line l2"></div>
            <div class="card2-line l3"></div>
        </div>

        <div class="glass-card card3"></div>

        <div class="scan-line"></div>

        <div class="content">
            <div class="app-icon"><span>X</span></div>
            <div class="title"><span class="accent">Xencard</span> Keeper</div>
            <div class="tagline">Scan · Store · Connect</div>
        </div>
    </div>
</body>
</html>
